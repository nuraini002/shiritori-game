<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Shiritori Hiragana - Romaji</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7fee7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .game-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 3px solid #65a30d;
        }
        h1 {
            color: #3f6212;
            margin-bottom: 5px;
            font-size: 28px;
        }
        .rule {
            font-size: 14px;
            color: #4d7c0f;
            margin-bottom: 20px;
            background-color: #ecfccb;
            padding: 8px;
            border-radius: 8px;
        }
        .word-display {
            background-color: #f0fdf4;
            color: #16a34a;
            font-size: 36px;
            font-weight: bold;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 5px;
            border: 2px solid #bbf7d0;
        }
        .romaji-hint {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
            font-style: italic;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #65a30d;
        }
        button {
            padding: 12px 20px;
            background-color: #65a30d;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #4d7c0f;
        }
        .message {
            font-size: 14px;
            margin-bottom: 15px;
            height: 20px;
            font-weight: 500;
        }
        .error { color: #dc2626; }
        .success { color: #16a34a; }
        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            color: #334155;
            border-top: 1px solid #e2e8f0;
            padding-top: 15px;
            margin-top: 15px;
        }
        .history {
            text-align: left;
            max-height: 80px;
            overflow-y: auto;
            font-size: 13px;
            color: #64748b;
            background: #f8fafc;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>しりとり (Shiritori)</h1>
    <p class="rule">Soal pakai Hiragana, Jawab pakai huruf Latin biasa!</p>
    
    <div class="word-display" id="currentWord">しりとり</div>
    <div class="romaji-hint" id="romajiHint">(shiritor<b>i</b>)</div>
    
    <div class="input-group">
        <input type="text" id="wordInput" placeholder="Ketik jawaban romaji/latin..." autocomplete="off">
        <button onclick="submitWord()">Kirim</button>
    </div>
    
    <div id="message" class="message"></div>
    
    <div class="stats">
        <div>Skor: <span id="score">0</span></div>
        <div>Huruf Depan Harus: <strong id="nextLetter" style="color:#65a30d; font-size:18px;">I</strong></div>
    </div>

    <div class="history" id="historyLog">
        <strong>Riwayat:</strong> shiritori
    </div>
</div>

<script>
    // Kamus mini konversi Romaji ke Hiragana dasar untuk validasi & display visual
    const romajiToHiragana = {
        'a':'あ','i':'い','u':'う','e':'え','o':'お',
        'ka':'か','ki':'き','ku':'く','ke':'け','ko':'こ',
        'sa':'さ','shi':'し','su':'す','se':'せ','so':'そ',
        'ta':'た','chi':'ち','tsu':'つ','te':'て','to':'と',
        'na':'な','ni':'に','nu':'ぬ','ne':'ね','no':'の',
        'ha':'は','hi':'ひ','fu':'ふ','he':'へ','ho':'ほ',
        'ma':'ま','mi':'み','mu':'む','me':'め','mo':'も',
        'ya':'や','yu':'ゆ','yo':'よ',
        'ra':'ら','ri':'り','ru':'る','re':'れ','ro':'ろ',
        'wa':'わ','wo':'を','n':'ん'
    };

    // State Awal Game
    let usedWords = ["shiritori"];
    let currentWordRomaji = "shiritori"; 
    let score = 0;

    const currentWordEl = document.getElementById("currentWord");
    const romajiHintEl = document.getElementById("romajiHint");
    const wordInputEl = document.getElementById("wordInput");
    const messageEl = document.getElementById("message");
    const scoreEl = document.getElementById("score");
    const nextLetterEl = document.getElementById("nextLetter");
    const historyLogEl = document.getElementById("historyLog");

    // Tangkap tombol Enter
    wordInputEl.addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            submitWord();
        }
    });

    // Fungsi pembantu mengubah teks romaji menjadi teks hiragana visual sederhana
    function convertToHiraganaDisplay(romaji) {
        let temp = romaji.toLowerCase();
        let result = "";
        let i = 0;
        
        while (i < temp.length) {
            if (i + 3 <= temp.length && romajiToHiragana[temp.substring(i, i + 3)]) {
                result += romajiToHiragana[temp.substring(i, i + 3)];
                i += 3;
            } else if (i + 2 <= temp.length && romajiToHiragana[temp.substring(i, i + 2)]) {
                result += romajiToHiragana[temp.substring(i, i + 2)];
                i += 2;
            } else if (romajiToHiragana[temp.charAt(i)]) {
                result += romajiToHiragana[temp.charAt(i)];
                i += 1;
            } else {
                result += temp.charAt(i);
                i += 1;
            }
        }
        return result;
    }

    function submitWord() {
        let inputWord = wordInputEl.value.trim().toLowerCase();
        messageEl.className = "message";
        messageEl.innerText = "";

        if (inputWord === "") {
            showMessage("Input tidak boleh kosong!", "error");
            return;
        }

        // Aturan Khusus Shiritori Jepang: Tidak boleh berakhiran huruf 'n' (ん) karena game akan langsung mati/kalah
        if (inputWord.endsWith('n') && !inputWord.endsWith('an') && !inputWord.endsWith('in') && !inputWord.endsWith('un') && !inputWord.endsWith('en') && !inputWord.endsWith('on')) {
             // Jika murni huruf mati 'n'
        }

        // Cari huruf terakhir dari kata sebelumnya
        let requiredLetter = currentWordRomaji.charAt(currentWordRomaji.length - 1);
        let firstLetter = inputWord.charAt(0);

        // Validasi 1: Huruf awal harus cocok dengan huruf akhir sebelumnya
        if (firstLetter !== requiredLetter) {
            showMessage(`Kata harus diawali huruf "${requiredLetter.toUpperCase()}"!`, "error");
            return;
        }

        // Validasi 2: Kata tidak boleh duplikat
        if (usedWords.includes(inputWord)) {
            showMessage(`Kata "${inputWord}" sudah pernah digunakan!`, "error");
            return;
        }

        // Validasi 3: Di permainan Jepang, kata tidak boleh berakhiran huruf 'N' mati (ん)
        if (inputWord.slice(-1) === 'n' && (inputWord.length === 1 || inputWord.slice(-2, -1) !== 'n')) {
            showMessage(`Game Over! Kata berakhiran 'N' tidak bisa dilanjutkan dalam Shiritori.`, "error");
            resetGame();
            return;
        }

        // Lolos validasi, update game state
        usedWords.push(inputWord);
        currentWordRomaji = inputWord;
        score += 1;

        // Tampilkan konversi hiragana ke layar utama
        let hiraganaText = convertToHiraganaDisplay(inputWord);
        currentWordEl.innerText = hiraganaText;
        
        // Tampilkan petunjuk romaji di bawahnya agar pemain tidak bingung
        let lastChar = inputWord.charAt(inputWord.length - 1);
        let bodyChar = inputWord.substring(0, inputWord.length - 1);
        romajiHintEl.innerHTML = `(${bodyChar}<b>${lastChar}</b>)`;

        // Update skor dan huruf berikutnya
        scoreEl.innerText = score;
        nextLetterEl.innerText = lastChar.toUpperCase();
        
        // Update riwayat teks
        historyLogEl.innerHTML += `, ${inputWord}`;
        
        wordInputEl.value = "";
        showMessage("Benar! +1 Skor", "success");
    }

    function showMessage(text, type) {
        messageEl.innerText = text;
        messageEl.className = `message ${type}`;
    }

    function resetGame() {
        usedWords = ["shiritori"];
        currentWordRomaji = "shiritori";
        score = 0;
        currentWordEl.innerText = "しりとり";
        romajiHintEl.innerHTML = "(shiritor<b>i</b>)";
        scoreEl.innerText = score;
        nextLetterEl.innerText = "I";
        historyLogEl.innerHTML = "<strong>Riwayat:</strong> shiritori";
        wordInputEl.value = "";
    }
</script>

</body>
</html>
